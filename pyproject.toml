[project]
name = "tiny-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "scikit-learn",
]

[project.optional-dependencies]
